name: Windows release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: work/aerodesk/package-lock.json
      - name: Check tag matches application version
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node -e "if(process.env.RELEASE_TAG!=='v'+require('./work/aerodesk/package.json').version)process.exit(1)"
      - run: npm run check:repo
      - run: npm run setup
      - run: npm test
      - run: npm run dist
      - name: Upload distributable
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: AeroDesk-Windows-x64
          path: |
            outputs/releases/*.zip
            outputs/releases/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
      - name: Create draft release for review
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          GH_REPO: ${{ github.repository }}
        shell: pwsh
        run: |
          $zip = Get-ChildItem -LiteralPath outputs/releases -Filter *.zip
          if ($zip.Count -ne 1) { throw 'Expected one release archive' }
          gh release create $env:RELEASE_TAG $zip.FullName outputs/releases/SHA256SUMS.txt --draft --verify-tag --title "AeroDesk $env:RELEASE_TAG" --notes-file docs/RELEASE_NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Draft release creation failed' }
